# AjParkourBastion - BASTION MC
# El mundo y las esquinas se pueden modificar con /ajparkour set posicion 1 y 2.
area:
  world: 'Void'
  pos1: '-20,90,16'
  pos2: '35,130,74'
  # Si no se define, se busca una zona alta y libre con 3 plataformas posibles.
  start: ''
  # Se configura con /ajparkour set spawn; al caer regresarás aquí.
  return-spawn: ''
game:
  # Primera plataforma + 2 adelantadas = 3 visibles
  jumps-ahead: 2
  # Si el área está ocupada por construcciones, se pueden utilizar hasta 50 bloques
  # de altura adicionales sobre la esquina más alta (sin superar el límite del mundo).
  # Cambia a 0 para respetar estrictamente el máximo Y marcado.
  auto-elevate-max-blocks: 50
  idle-seconds: 120
  # Caer 5 bloques por debajo de la plataforma actual termina la partida y devuelve al Lobby.
  fall-distance: 5
  # Opcional: comando de spawn de DeluxeHub si no utilizas /ajparkour set lobbyspawn.
  # fall-command: spawn
  fall-command: '' 
  # Bloques en mundo: por seguridad solo una partida activa por area
  single-session: true
  # Conservar los huecos para facilitar los primeros saltos
  levels:
    easy-until: 20
    medium-until: 35
    hard-until: 50
  materials: [LIME_CONCRETE, LIGHT_BLUE_CONCRETE, YELLOW_CONCRETE, ORANGE_CONCRETE, PURPLE_CONCRETE, PINK_CONCRETE, CYAN_CONCRETE, RED_CONCRETE, BLUE_CONCRETE]
messages:
  prefix: '&#6BFF80&lBASTION PARKOUR &8» &r'
  start: '&a¡Comenzó el parkour! &7Salta al siguiente bloque.'
  score: '&#6BFF80+1 punto &8| &fPuntuación: &e%score% &8| &7Dificultad: &f%level%'
  finish: '&eTerminaste con &6%score% &epuntos. &7Récord: &f%best%'
  record: '&6¡Nuevo récord personal: %best% puntos!'
  busy: '&cLa arena está ocupada. Espera a que termine la partida actual.'
  no-area: '&cEl mundo o las esquinas de la arena no son válidos. Comprueba area.world, pos1 y pos2.'
  no-space: '&cNo se encontró un perímetro despejado para el parkour. Comprueba la altura de la arena y /ajparkour diagnostico.'
  relocated: "&e¡Ruta renovada! &7Continuas con &a%score% &7puntos."
  no-route: '&cSe detectó un obstáculo inesperado. La ruta no se ha borrado; avisa a un administrador.'
  left: '&7Has salido del parkour.'
  fell: '&c¡Te caíste! &7Regresando al spawn del Lobby. Puntos: &e%score%'
  usage: '&eUsa /ajparkour start, salir, top, set posicion 1/2, set spawn (regreso) o set inicio.'
  set-corner: '&aEsquina %corner% guardada en &f%position%'
  set-start: '&aReferencia de inicio guardada.'
  set-lobby-spawn: '&aSpawn de regreso guardado. Al caer volverás a esta posición.'
  reloaded: '&aConfiguración recargada.'
  no-permission: '&cNo tienes permiso para usar ese comando.'
  top-header: '&#6BFF80&lTOP PARKOUR'
  top-line: '&e%rank%. &f%name% &8- &a%score% puntos'

