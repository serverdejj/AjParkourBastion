# AjParkourBastion - BASTION MC
# El mundo y las esquinas se pueden modificar con /ajparkour set posicion 1 y 2.
area:
  world: 'Void'
  pos1: '-20,90,16'
  pos2: '35,130,74'
  # Se buscará una ruta despejada priorizando game.preferred-platform-y.
  start: ''
  # Se configura con /ajparkour set spawn; al caer regresarás aquí.
  return-spawn: 'Void,0.560,59.000,29.409,0,0'
game:
  # Primera plataforma + 2 adelantadas = 3 visibles
  jumps-ahead: 2
  # Si el área está ocupada por construcciones, se pueden utilizar hasta 50 bloques
  # de altura adicionales sobre la esquina más alta (sin superar el límite del mundo).
  # Cambia a 0 para respetar estrictamente el máximo Y marcado.
  auto-elevate-max-blocks: 50
  # Analizado en el mapa Void: las construcciones sólidas de la arena original
  # llegan aproximadamente hasta Y=139. El circuito prioriza Y=148.
  preferred-platform-y: 148
  idle-seconds: 120
  # Caer 5 bloques por debajo de la plataforma actual termina la partida y devuelve al Lobby.
  fall-distance: 5
  # Opcional: comando de spawn de DeluxeHub si no utilizas /ajparkour set lobbyspawn.
  # fall-command: spawn
  fall-command: '' 
  # Máximo de jugadores simultáneos (1-4); cada uno ocupa un cuadrante propio.
  max-players: 4
  # Restaura los efectos que el jugador tenía antes de entrar al terminar.
  restore-effects-on-exit: true
  # Conservar los huecos para facilitar los primeros saltos
  levels:
    easy-until: 20
    medium-until: 35
    hard-until: 50
  materials: [LIME_CONCRETE, LIGHT_BLUE_CONCRETE, YELLOW_CONCRETE, ORANGE_CONCRETE, PURPLE_CONCRETE, PINK_CONCRETE, CYAN_CONCRETE, RED_CONCRETE, BLUE_CONCRETE]
